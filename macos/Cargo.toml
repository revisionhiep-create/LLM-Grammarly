[package]
name = "llm-grammarly"
version = "1.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "LLM-Grammarly"
path = "src/main.rs"

[dependencies]
anyhow = "1"
directories = "6"
eframe = "0.31"
libc = "0.2"
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["common", "metal"] }
quick-xml = "0.37"
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[build-dependencies]
cc = "1"
png = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
